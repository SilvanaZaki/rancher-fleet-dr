# OVERLAY FILE — only for the DR cluster
# Fleet merges this on top of the base nginx-internal.yaml
# Only the fields listed here are changed; everything else is inherited

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-internal
  namespace: nginx-lab
spec:
  replicas: 0
  selector:
    matchLabels:
      app: nginx-internal
  template:
    metadata:
      labels:
        app: nginx-internal
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-internal-svc
  namespace: nginx-lab
spec:
  type: ClusterIP
  selector:
    app: nginx-internal
  ports:
  - port: 80
    targetPort: 80
