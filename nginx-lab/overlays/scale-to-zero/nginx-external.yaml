# OVERLAY FILE — only for the DR cluster
# Same principle: name and namespace must match the base file so Fleet knows what to patch

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-external
  namespace: nginx-lab
spec:
  replicas: 0
  selector:
    matchLabels:
      app: nginx-external
  template:
    metadata:
      labels:
        app: nginx-external
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-external-svc
  namespace: nginx-lab
spec:
  type: NodePort
  selector:
    app: nginx-external
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
