defaultNamespace: squadwebapp
kustomize:
  dir: overlays/off            # safe default: unknown cluster = standby
targetCustomizations:
  - name: active
    clusterSelector:
      matchLabels:
        dr-role: active
    kustomize:
      dir: overlays/on
  - name: standby
    clusterSelector:
      matchLabels:
        dr-role: standby
    kustomize:
      dir: overlays/off
